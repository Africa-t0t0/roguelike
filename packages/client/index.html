<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roguelike co-op</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d14; color: #eee;
        font: 15px system-ui, sans-serif; }
      #game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      [hidden] { display: none !important; }
      .panel { position: absolute; inset: 0; margin: auto; width: min(22rem, calc(100% - 2rem)); height: fit-content;
        padding: 1.5rem; border-radius: 0.75rem; background: rgba(20, 20, 32, 0.92);
        box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 0.75rem; }
      .panel h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
      label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; color: #bbb; }
      input { font: inherit; padding: 0.5rem 0.6rem; border-radius: 0.4rem; border: 1px solid #444;
        background: #111; color: #eee; }
      #code { text-transform: uppercase; letter-spacing: 0.15em; }
      button { font: inherit; padding: 0.55rem 0.9rem; border-radius: 0.4rem; border: 0; cursor: pointer;
        background: #e8a33a; color: #1a1206; font-weight: 600; }
      button:disabled { opacity: 0.5; cursor: progress; }
      .row { display: flex; gap: 0.5rem; align-items: flex-end; }
      .row label { flex: 1; }
      .divider { text-align: center; color: #777; font-size: 0.8rem; }
      .error { min-height: 1.2em; margin: 0; color: #ff8a80; }
      /* ---- HUD de fantasía oscura: paneles casi negros, filetes dorados y tipografía con serifa ---- */
      :root { --gold: #c9a35c; --gold-hi: #ecd08f; --gold-dim: rgba(201, 163, 92, 0.45); --ink: rgba(9, 8, 7, 0.78);
        --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif; --caps: "Cinzel", Georgia, serif; }
      #hud { position: absolute; top: 0.9rem; left: 0.9rem; padding: 0.45rem 0.8rem; max-width: 19rem;
        background: linear-gradient(90deg, var(--ink), rgba(9, 8, 7, 0.35)); border-left: 2px solid var(--gold-dim);
        font: 600 1rem var(--serif); color: #e9dcc0; box-sizing: border-box; }
      #hud-code { font-family: var(--caps); font-weight: 700; letter-spacing: 0.2em; color: var(--gold-hi); user-select: all; }
      .hint { color: rgba(233, 220, 192, 0.55); font: 500 0.82rem/1.35 var(--serif); margin-top: 0.15rem; }
      .combat-hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--serif); }

      /* Tarjeta del personaje: retrato en rombo + arma + barras. */
      .hud-card { position: absolute; left: 1.6rem; bottom: 1.6rem; display: flex; align-items: center; }
      .hud-portrait { position: relative; z-index: 1; width: 7.6rem; height: 7.6rem; flex: none; }
      .hud-portrait::before { content: ""; position: absolute; inset: 0.7rem; transform: rotate(45deg);
        background: #15110c; border: 2px solid var(--gold); box-shadow: 0 0 0 4px rgba(9, 8, 7, 0.85),
        0 0 0 5px var(--gold-dim), 0 0.4rem 1.2rem rgba(0, 0, 0, 0.7); }
      .hud-portrait img { position: absolute; inset: 0.85rem; width: calc(100% - 1.7rem); height: calc(100% - 1.7rem);
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); object-fit: cover; }
      .hud-level { position: absolute; left: 50%; bottom: -0.35rem; transform: translateX(-50%); min-width: 1.5rem;
        padding: 0 0.3rem; text-align: center; font: 700 1rem/1.6rem var(--caps); color: var(--gold-hi);
        background: #120f0b; border: 1px solid var(--gold); clip-path: polygon(15% 0, 85% 0, 100% 50%, 85% 100%, 15% 100%, 0 50%); }
      .hud-bars { display: flex; flex-direction: column; gap: 0.3rem; margin-left: -0.9rem; padding-left: 1.3rem;
        width: min(24rem, calc(100vw - 11rem)); }
      .hud-weapon { font: 700 1.2rem var(--serif); letter-spacing: 0.02em; text-shadow: 0 1px 3px #000, 0 0 8px rgba(0, 0, 0, 0.8); }
      .hud-bar { position: relative; overflow: hidden; background: rgba(9, 8, 7, 0.82);
        border: 1px solid var(--gold-dim); clip-path: polygon(0 0, calc(100% - 0.7rem) 0, 100% 50%, calc(100% - 0.7rem) 100%, 0 100%); }
      .hud-hp { height: 1.95rem; }
      .hud-hprow { display: flex; align-items: center; gap: 0.5rem; }
      .hud-hprow > .hud-hp { flex: 1; min-width: 0; }
      .hud-status { display: flex; gap: 0.35rem; }
      .hud-st { padding: 0.05rem 0.45rem; font: 700 1rem/1.4rem var(--caps); background: var(--ink); border: 1px solid currentColor;
        text-shadow: 0 1px 2px #000; clip-path: polygon(12% 0, 88% 0, 100% 50%, 88% 100%, 12% 100%, 0 50%); }
      .hud-st-burn { color: rgb(255, 115, 26); }
      .hud-st-slow { color: rgb(140, 242, 255); }
      .hud-st-stun { color: rgb(255, 235, 102); }
      .hud-xp { height: 1.15rem; width: 82%; }
      .hud-fill { position: absolute; inset: 0 auto 0 0; width: 0; transition: width 0.2s ease-out; }
      .hud-hp .hud-fill { background: linear-gradient(#c43a2f, #8c1f17 60%, #6d1610); box-shadow: inset 0 1px 0 rgba(255, 170, 150, 0.35); }
      .hud-xp .hud-fill { background: linear-gradient(#e2bf6a, #a97d2c); box-shadow: inset 0 1px 0 rgba(255, 240, 200, 0.4); }
      .hud-text { position: relative; padding: 0 0.6rem; font: 700 1.2rem/1.95rem var(--serif); color: #f6ead2;
        text-shadow: 0 1px 2px #000; display: flex; align-items: center; gap: 0.4rem; font-variant-numeric: tabular-nums; }
      .hud-heart { color: #f0b27a; font-size: 1.05rem; }
      .hud-xp .hud-text { font: 600 0.9rem/1.15rem var(--serif); }
      /* Equipo y reliquia: 5 iconos con el borde del tier; el tooltip sale al pasar el mouse o con Tab mantenido. */
      .hud-equip { position: relative; display: flex; flex-wrap: wrap; gap: 0.1rem; margin-top: 0.1rem; margin-left: -0.3rem; }
      .hud-gear { --gz: 3.4rem; position: relative; width: var(--gz); height: var(--gz); flex: none; pointer-events: auto; }
      .hud-gear::before { content: ""; position: absolute; inset: calc(var(--gz) * 0.147); transform: rotate(45deg);
        background: var(--gear-bg, #15110c); border: 2px solid var(--gold); box-shadow: 0 0 0 2px rgba(9, 8, 7, 0.85),
        0 0 0 3px var(--gear-edge, var(--gold-dim)), 0 0.2rem 0.6rem rgba(0, 0, 0, 0.7); }
      .hud-gear-glyph { position: absolute; inset: calc(var(--gz) * 0.1); display: block; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.8)); }
      .hud-gear-svg { display: block; width: 100%; height: 100%; }
      .hud-gear-empty .hud-gear-glyph { opacity: 0.2; filter: grayscale(1) brightness(0.8); }
      .hud-gear-empty::before { border-color: var(--gold-dim); box-shadow: 0 0 0 2px rgba(9, 8, 7, 0.85), 0 0 0 3px #3a3224; }
      .hud-tip { display: none; position: absolute; left: 0; bottom: calc(100% + 0.45rem); z-index: 3; min-width: 13rem; max-width: 18rem;
        padding: 0.4rem 0.6rem; background: rgba(9, 8, 7, 0.95); border: 1px solid var(--gold-dim); font: 500 0.85rem var(--serif);
        color: #d9cba8; text-align: left; pointer-events: none; }
      .hud-gear:hover .hud-tip { display: block; }
      .hud-tipbox { position: absolute; left: 0; bottom: calc(100% + 0.45rem); z-index: 3; display: flex; flex-direction: column; gap: 0.3rem; }
      .hud-tipbox .hud-tip { display: block; position: static; }
      .hud-tip-name { font: 700 0.95rem var(--serif); margin-bottom: 0.15rem; }
      .hud-tip-fx { margin-top: 0.2rem; color: var(--gold-hi); }
      .hud-tip-tradeoff { margin-top: 0.2rem; color: #e8896f; }
      .hud-tip-inactive { color: #8a8478; font-style: italic; }
      .hud-banner { position: absolute; left: 0; right: 0; top: 20%; text-align: center; font: 700 2.8rem var(--caps);
        letter-spacing: 0.08em; color: var(--gold-hi); text-shadow: 0 2px 10px #000, 0 0 24px rgba(201, 163, 92, 0.45); }
      .hud-death { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(rgba(40, 0, 0, 0.25), rgba(30, 0, 0, 0.7)); font: 700 2rem var(--caps);
        letter-spacing: 0.06em; color: #e7c9b0; text-shadow: 0 2px 8px #000; }
      /* Grito de guerra activo: la tarjeta brilla en dorado (fijo; el buff también queda quieto en la pausa). */
      .hud-buffed .hud-portrait::before { border-color: var(--gold-hi); box-shadow: 0 0 0 4px rgba(9, 8, 7, 0.85),
        0 0 0 5px var(--gold-hi), 0 0 1.6rem 0.45rem rgba(240, 190, 90, 0.7), 0 0.4rem 1.2rem rgba(0, 0, 0, 0.7); }
      .hud-buffed .hud-portrait { filter: drop-shadow(0 0 0.5rem rgba(255, 205, 110, 0.95)) drop-shadow(0 0 1.3rem rgba(240, 170, 60, 0.7)); }
      .hud-buffed .hud-bars { filter: drop-shadow(0 0 0.5rem rgba(240, 190, 90, 0.7)); }
      .hud-buffed .hud-weapon::after { content: " ✶"; color: var(--gold-hi); }
      .hud-choosing .hud-banner { display: none; }

      /* Barra de habilidades abajo a la derecha: casillas con filete dorado, tecla, glifo, rango y enfriamiento. */
      .ability-bar { position: absolute; right: 1.6rem; bottom: 1.6rem; display: flex; align-items: flex-end; gap: 0.6rem;
        pointer-events: none; font-family: var(--serif); }
      .ab-slot { position: relative; width: 3.7rem; height: 3.7rem; display: grid; place-items: center; overflow: visible;
        background: linear-gradient(#1a1510, #0c0a07 70%); border: 1px solid var(--gold);
        box-shadow: 0 0 0 3px rgba(9, 8, 7, 0.85), 0 0 0 4px var(--gold-dim), 0 0.4rem 1.2rem rgba(0, 0, 0, 0.7);
        transition: box-shadow 0.15s, border-color 0.15s; }
      .ab-glyph { font: 700 2.05rem/1 var(--serif); color: var(--gold-hi); margin-top: -0.3rem;
        text-shadow: 0 1px 3px #000, 0 0 10px rgba(201, 163, 92, 0.45); }
      .ab-sweep { position: absolute; inset: 0; background: conic-gradient(rgba(5, 4, 3, 0.8) calc(var(--cd, 0) * 360deg), transparent 0); }
      .ab-cd { position: absolute; inset: 0; display: grid; place-items: center; font: 700 1.4rem var(--caps); color: #f6ead2;
        text-shadow: 0 1px 3px #000, 0 0 6px #000; font-variant-numeric: tabular-nums; }
      .ab-key { position: absolute; left: -0.5rem; top: -0.5rem; width: 1.25rem; height: 1.25rem; display: grid; place-items: center;
        font: 700 0.75rem/1 var(--caps); color: #f6ead2; background: #120f0b; border: 1px solid var(--gold-hi); }
      .ab-charges { position: absolute; right: 0.15rem; top: 0.1rem; font: 700 0.95rem/1 var(--caps); color: var(--gold-hi);
        text-shadow: 0 1px 3px #000, 0 0 5px #000; font-variant-numeric: tabular-nums; }
      .ab-pips { position: absolute; left: 0; right: 0; bottom: 0.15rem; text-align: center; font-size: 0.55rem; line-height: 1;
        letter-spacing: 0.14em; color: var(--gold); text-shadow: 0 1px 2px #000; }
      .ab-cooling .ab-glyph { color: rgba(236, 208, 143, 0.45); }
      .ab-active { border-color: var(--gold-hi); box-shadow: 0 0 0 3px rgba(9, 8, 7, 0.85), 0 0 0 4px var(--gold-hi),
        0 0 1.2rem rgba(236, 208, 143, 0.65), 0 0.4rem 1.2rem rgba(0, 0, 0, 0.7); }
      .ab-active .ab-glyph { color: #fff3d0; }
      .ab-empty { opacity: 0.35; border-color: var(--gold-dim); background: rgba(9, 8, 7, 0.6); }
      .ab-empty .ab-key { border-color: var(--gold-dim); color: rgba(233, 220, 192, 0.6); }
      .ab-passive { position: relative; width: 2.7rem; height: 2.7rem; margin: 0 0.3rem 0.75rem 0; display: grid; place-items: center;
        isolation: isolate; }
      .ab-passive::before { content: ""; position: absolute; inset: 0.4rem; z-index: -1; transform: rotate(45deg); background: #15110c;
        border: 1px solid var(--gold); box-shadow: 0 0 0 2px rgba(9, 8, 7, 0.85), 0 0 0 3px var(--gold-dim), 0 0 8px rgba(236, 208, 143, 0.35); }
      .ab-passive-glyph { font: 700 1.1rem/1 var(--serif); color: var(--gold-hi); text-shadow: 0 1px 2px #000; }
      .ab-passive .ab-pips { bottom: -0.95rem; }
      @media (max-width: 62rem) {
        .ability-bar { bottom: 11rem; }
        .hud-gear { --gz: 3rem; }
      }

      /* Brújula arriba al centro, con el reloj del piso debajo. */
      .compass { position: absolute; top: 0.9rem; left: 50%; transform: translateX(-50%); width: min(34rem, 56vw);
        pointer-events: none; text-align: center; }
      .compass-strip { position: relative; height: 1.9rem; border-bottom: 1px solid var(--gold-dim);
        mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
      .compass-mark { position: absolute; bottom: 0; width: 1px; height: 0.35rem; background: var(--gold); transform: translateX(-50%); }
      .compass-cardinal { width: auto; height: auto; background: none; bottom: 0.35rem; font: 700 0.95rem var(--caps);
        color: #e9dcc0; text-shadow: 0 1px 3px #000; }
      .compass-pin { position: absolute; left: 50%; bottom: -0.38rem; width: 0.6rem; height: 0.6rem; transform: translateX(-50%) rotate(45deg);
        background: #120f0b; border: 1px solid var(--gold-hi); box-shadow: 0 0 6px rgba(236, 208, 143, 0.6); }
      .compass-clock { margin-top: 0.7rem; display: inline-block; padding: 0.1rem 0.9rem; font: 600 1.35rem var(--serif);
        color: #f3e6c8; font-variant-numeric: tabular-nums; letter-spacing: 0.06em; text-shadow: 0 1px 3px #000, 0 0 10px #000;
        background: radial-gradient(rgba(9, 8, 7, 0.75), transparent 70%); }
      .compass-notice { margin-top: 0.5rem; font: 600 1.05rem var(--serif); color: #bcd9ff; letter-spacing: 0.05em;
        text-shadow: 0 1px 3px #000, 0 0 12px rgba(80, 140, 255, 0.8); }

      /* Minimapa circular arriba a la derecha. */
      .minimap { position: absolute; top: 1.1rem; right: 1.4rem; width: 10.5rem; height: 10.5rem; pointer-events: none; }
      .minimap canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%;
        background: radial-gradient(rgba(24, 20, 15, 0.82), rgba(9, 8, 7, 0.9)); }
      .minimap-ring { position: absolute; inset: -0.25rem; border-radius: 50%; border: 1px solid var(--gold);
        box-shadow: 0 0 0 3px rgba(9, 8, 7, 0.8), 0 0 0 4px var(--gold-dim), 0 0.3rem 1rem rgba(0, 0, 0, 0.6); }
      .minimap-card { position: absolute; width: 1.35rem; height: 1.35rem; margin: -0.675rem; display: grid; place-items: center;
        font: 700 0.72rem/1 var(--caps); color: var(--gold-hi); }
      .minimap-card::before { content: ""; position: absolute; inset: 0.15rem; z-index: -1; transform: rotate(45deg);
        background: #120f0b; border: 1px solid var(--gold); }
      .minimap-card { isolation: isolate; }
      .minimap-n { left: 50%; top: 0; } .minimap-s { left: 50%; top: 100%; }
      .minimap-e { left: 100%; top: 50%; } .minimap-w { left: 0; top: 50%; }

      /* Aviso de recoger, anclado al objeto con una línea guía. */
      .pickup-hint { position: absolute; left: 0; top: 0; pointer-events: none; display: flex; align-items: center; gap: 0.5rem;
        margin: -3.2rem 0 0 2.2rem; padding: 0.25rem 0.9rem 0.25rem 0.3rem; white-space: nowrap;
        background: linear-gradient(90deg, rgba(9, 8, 7, 0.88), rgba(9, 8, 7, 0.5)); border-bottom: 1px solid var(--gold-dim);
        font: 600 1.05rem var(--serif); color: #f3e6c8; text-shadow: 0 1px 2px #000; will-change: transform; }
      .pickup-hint::before { content: ""; position: absolute; left: -2.2rem; top: 100%; width: 2.6rem; height: 1px;
        background: var(--gold); transform-origin: right center; transform: translate(-0.4rem, 0) rotate(-50deg); }
      .pickup-key { display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border: 1px solid var(--gold-hi);
        background: #120f0b; font: 700 0.95rem var(--caps); color: #f6ead2; }
      .pickup-name { font-weight: 700; }
      .pickup-hint:has(.pickup-line) { flex-wrap: wrap; row-gap: 0.1rem; }
      .pickup-lines { flex-basis: 100%; padding-left: 2.1rem; font: 500 0.85rem var(--serif); color: #d9cba8; }
      .pickup-lines:empty { display: none; }
      .pickup-inactive { color: #8a8478; font-style: italic; }
      /* Panel de cartas al subir de nivel: en la pausa, un velo que apaga la escena congelada. */
      .choice-veil { position: absolute; inset: 0; z-index: 4; backdrop-filter: saturate(0.35) brightness(0.8);
        background: radial-gradient(ellipse at center, rgba(9, 8, 7, 0.35), rgba(5, 4, 3, 0.85)); }
      .choice { position: absolute; left: 50%; top: 50%; z-index: 5; transform: translate(-50%, -50%);
        width: min(54rem, calc(100% - 2rem)); max-height: calc(100% - 2rem); overflow-y: auto; box-sizing: border-box;
        display: flex; flex-direction: column; align-items: center; gap: 0.9rem; padding: 1.4rem 1rem;
        background: radial-gradient(ellipse at center, rgba(9, 8, 7, 0.7), transparent 72%);
        font-family: var(--serif); color: #e9dcc0; text-align: center; }
      .choice-title { font: 700 2.1rem var(--caps); letter-spacing: 0.1em; color: var(--gold-hi);
        text-shadow: 0 2px 10px #000, 0 0 24px rgba(201, 163, 92, 0.4); }
      .choice-meta { display: flex; align-items: center; justify-content: center; gap: 0.9rem; margin-top: 0.3rem; }
      .choice-heading { font: 600 1.2rem var(--serif); letter-spacing: 0.04em; text-shadow: 0 1px 3px #000; }
      .choice-clock { padding: 0.05rem 0.7rem; font: 700 1.05rem/1.6rem var(--caps); color: var(--gold-hi);
        font-variant-numeric: tabular-nums; background: #120f0b; border: 1px solid var(--gold);
        box-shadow: 0 0 0 2px rgba(9, 8, 7, 0.85), 0 0 0 3px var(--gold-dim); }
      /* Con el panel a la vista, el aviso "¡Nivel N!" no se le encima. */
      body:has(.choice:not([hidden])) .hud-banner { visibility: hidden; }
      .choice-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.1rem; width: 100%; margin-top: 0.6rem; }
      .choice-card { display: flex; flex-direction: column; align-items: center; gap: 0.55rem; min-height: 12.5rem;
        padding: 0 1.1rem 1.4rem; border-radius: 0; border: 1px solid var(--gold-dim); cursor: pointer;
        background: linear-gradient(#1a1510, #0c0a07 70%); color: #e9dcc0; font: inherit; text-align: center;
        box-shadow: inset 0 0 0 3px rgba(9, 8, 7, 0.9), inset 0 0 0 4px rgba(201, 163, 92, 0.16), 0 0.6rem 1.6rem rgba(0, 0, 0, 0.65);
        transition: transform 0.15s ease-out, border-color 0.15s, box-shadow 0.15s, opacity 0.2s; }
      .choice-card::before { content: ""; width: 0.75rem; height: 0.75rem; margin: -0.42rem 0 0.7rem; transform: rotate(45deg);
        background: #120f0b; border: 1px solid var(--gold); }
      .choice-card:hover:not(:disabled) { transform: translateY(-4px); border-color: var(--gold-hi);
        box-shadow: inset 0 0 0 3px rgba(9, 8, 7, 0.9), inset 0 0 0 4px rgba(236, 208, 143, 0.3), 0 0 1.4rem rgba(201, 163, 92, 0.35),
          0 0.8rem 1.8rem rgba(0, 0, 0, 0.7); }
      .choice-card:disabled { cursor: default; opacity: 1; }
      .choice-ability { border-color: var(--gold); }
      .choice-ability::before { background: var(--gold); box-shadow: 0 0 8px rgba(236, 208, 143, 0.7); }
      .choice-kind { font: 500 0.72rem var(--caps); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
      .choice-name { font: 700 1.6rem/1.1 var(--serif); color: #f6ead2; text-shadow: 0 1px 3px #000; }
      .choice-ability .choice-name { color: var(--gold-hi); }
      .choice-text { font: 500 1.08rem/1.35 var(--serif); color: rgba(233, 220, 192, 0.82); }
      .choice-done .choice-card { opacity: 0.35; }
      .choice-done .choice-card.choice-picked { opacity: 1; border-color: var(--gold-hi);
        box-shadow: inset 0 0 0 3px rgba(9, 8, 7, 0.9), inset 0 0 0 4px rgba(236, 208, 143, 0.35), 0 0 1.6rem rgba(201, 163, 92, 0.45); }
      .choice-status { font: italic 500 1.15rem var(--serif); color: rgba(233, 220, 192, 0.75); text-shadow: 0 1px 3px #000; }
      .choice-group { font: 600 1.05rem var(--serif); letter-spacing: 0.03em; color: #e9dcc0; text-shadow: 0 1px 3px #000; }
      @media (max-width: 44rem) {
        .hud-gear { --gz: 2.4rem; }
        .choice-cards { grid-template-columns: 1fr; }
        .choice-card { min-height: 0; }
      }
      .fx-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .fx-number { position: absolute; left: 0; top: 0; font: 700 1.6rem "Cormorant Garamond", Georgia, serif;
        text-shadow: 0 1px 3px #000, 0 0 2px #000; will-change: transform, opacity; }
      .fx-enemy { color: #fff; }
      .fx-player { color: #ff4a3d; }
      .fx-hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0;
        box-shadow: inset 0 0 6rem 1.5rem rgba(220, 20, 10, 0.75); }

      /* Panel de pruebas (?sandbox=1): a la derecha, bajo el minimapa; F2 lo abre y cierra. */
      .dev-tab { position: absolute; top: 12.6rem; right: 1.4rem; padding: 0.25rem 0.6rem; pointer-events: none;
        font: 700 0.72rem var(--caps); letter-spacing: 0.12em; color: var(--gold); background: var(--ink);
        border: 1px solid var(--gold-dim); }
      .dev-panel { position: absolute; top: 12.6rem; right: 1.4rem; width: 14rem; max-height: calc(100% - 26rem);
        min-height: 8rem; overflow-y: auto; padding: 0.6rem 0.7rem; display: flex; flex-direction: column; gap: 0.6rem;
        background: rgba(9, 8, 7, 0.9); border: 1px solid var(--gold-dim); box-shadow: 0 0.4rem 1.2rem rgba(0, 0, 0, 0.7);
        font: 600 0.9rem var(--serif); color: #e9dcc0; }
      .dev-section { display: flex; flex-direction: column; gap: 0.3rem; }
      .dev-title { font: 700 0.7rem var(--caps); letter-spacing: 0.14em; color: var(--gold-hi); text-transform: uppercase; }
      .dev-panel button, .dev-panel select { font: 600 0.85rem var(--serif); padding: 0.3rem 0.5rem; border-radius: 0.25rem;
        border: 1px solid var(--gold-dim); background: #15110c; color: #e9dcc0; text-align: left; }
      .dev-panel button:hover { border-color: var(--gold); }
      .dev-panel button.on { background: #3a2c14; border-color: var(--gold); color: var(--gold-hi); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <form id="lobby" class="panel" autocomplete="off">
      <h1>Roguelike co-op</h1>
      <label>Tu nombre <input id="name" maxlength="16" /></label>
      <button id="create" type="button">Crear sala</button>
      <div class="divider">o</div>
      <div class="row">
        <label>Código de sala <input id="code" maxlength="5" /></label>
        <button id="join" type="submit">Unirse</button>
      </div>
      <p id="lobby-error" class="error" role="alert"></p>
    </form>

    <div id="hud" hidden>
      Sala <span id="hud-code"></span>
      <div class="hint">Clic para mirar · WASD moverse · Shift correr · Espacio saltar · Clic izq. atacar · 1-4 habilidades · E tomar arma</div>
    </div>

    <div id="lost" class="panel" hidden>
      <p>Se perdió la conexión</p>
      <button id="rejoin" type="button">Volver a entrar</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
