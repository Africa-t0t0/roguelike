<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roguelike co-op</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d14; color: #eee;
        font: 15px system-ui, sans-serif; }
      #game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      [hidden] { display: none !important; }
      .panel { position: absolute; inset: 0; margin: auto; width: min(22rem, calc(100% - 2rem)); height: fit-content;
        padding: 1.5rem; border-radius: 0.75rem; background: rgba(20, 20, 32, 0.92);
        box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 0.75rem; }
      .panel h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
      label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; color: #bbb; }
      input { font: inherit; padding: 0.5rem 0.6rem; border-radius: 0.4rem; border: 1px solid #444;
        background: #111; color: #eee; }
      #code { text-transform: uppercase; letter-spacing: 0.15em; }
      button { font: inherit; padding: 0.55rem 0.9rem; border-radius: 0.4rem; border: 0; cursor: pointer;
        background: #e8a33a; color: #1a1206; font-weight: 600; }
      button:disabled { opacity: 0.5; cursor: progress; }
      .row { display: flex; gap: 0.5rem; align-items: flex-end; }
      .row label { flex: 1; }
      .divider { text-align: center; color: #777; font-size: 0.8rem; }
      .error { min-height: 1.2em; margin: 0; color: #ff8a80; }
      /* ---- HUD de fantasía oscura: paneles casi negros, filetes dorados y tipografía con serifa ---- */
      :root { --gold: #c9a35c; --gold-hi: #ecd08f; --gold-dim: rgba(201, 163, 92, 0.45); --ink: rgba(9, 8, 7, 0.78);
        --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif; --caps: "Cinzel", Georgia, serif; }
      #hud { position: absolute; top: 0.9rem; left: 0.9rem; padding: 0.45rem 0.8rem; max-width: 19rem;
        background: linear-gradient(90deg, var(--ink), rgba(9, 8, 7, 0.35)); border-left: 2px solid var(--gold-dim);
        font: 600 1rem var(--serif); color: #e9dcc0; box-sizing: border-box; }
      #hud-code { font-family: var(--caps); font-weight: 700; letter-spacing: 0.2em; color: var(--gold-hi); user-select: all; }
      .hint { color: rgba(233, 220, 192, 0.55); font: 500 0.82rem/1.35 var(--serif); margin-top: 0.15rem; }
      .combat-hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--serif); }

      /* Tarjeta del personaje: retrato en rombo + arma + barras. */
      .hud-card { position: absolute; left: 1.6rem; bottom: 1.6rem; display: flex; align-items: center; }
      .hud-portrait { position: relative; z-index: 1; width: 7.6rem; height: 7.6rem; flex: none; }
      .hud-portrait::before { content: ""; position: absolute; inset: 0.7rem; transform: rotate(45deg);
        background: #15110c; border: 2px solid var(--gold); box-shadow: 0 0 0 4px rgba(9, 8, 7, 0.85),
        0 0 0 5px var(--gold-dim), 0 0.4rem 1.2rem rgba(0, 0, 0, 0.7); }
      .hud-portrait img { position: absolute; inset: 0.85rem; width: calc(100% - 1.7rem); height: calc(100% - 1.7rem);
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); object-fit: cover; }
      .hud-level { position: absolute; left: 50%; bottom: -0.35rem; transform: translateX(-50%); min-width: 1.5rem;
        padding: 0 0.3rem; text-align: center; font: 700 1rem/1.6rem var(--caps); color: var(--gold-hi);
        background: #120f0b; border: 1px solid var(--gold); clip-path: polygon(15% 0, 85% 0, 100% 50%, 85% 100%, 15% 100%, 0 50%); }
      .hud-bars { display: flex; flex-direction: column; gap: 0.3rem; margin-left: -0.9rem; padding-left: 1.3rem;
        width: min(24rem, calc(100vw - 11rem)); }
      .hud-weapon { font: 700 1.2rem var(--serif); letter-spacing: 0.02em; text-shadow: 0 1px 3px #000, 0 0 8px rgba(0, 0, 0, 0.8); }
      .hud-bar { position: relative; overflow: hidden; background: rgba(9, 8, 7, 0.82);
        border: 1px solid var(--gold-dim); clip-path: polygon(0 0, calc(100% - 0.7rem) 0, 100% 50%, calc(100% - 0.7rem) 100%, 0 100%); }
      .hud-hp { height: 1.95rem; }
      .hud-xp { height: 1.15rem; width: 82%; }
      .hud-fill { position: absolute; inset: 0 auto 0 0; width: 0; transition: width 0.2s ease-out; }
      .hud-hp .hud-fill { background: linear-gradient(#c43a2f, #8c1f17 60%, #6d1610); box-shadow: inset 0 1px 0 rgba(255, 170, 150, 0.35); }
      .hud-xp .hud-fill { background: linear-gradient(#e2bf6a, #a97d2c); box-shadow: inset 0 1px 0 rgba(255, 240, 200, 0.4); }
      .hud-text { position: relative; padding: 0 0.6rem; font: 700 1.2rem/1.95rem var(--serif); color: #f6ead2;
        text-shadow: 0 1px 2px #000; display: flex; align-items: center; gap: 0.4rem; font-variant-numeric: tabular-nums; }
      .hud-heart { color: #f0b27a; font-size: 1.05rem; }
      .hud-xp .hud-text { font: 600 0.9rem/1.15rem var(--serif); }
      .hud-banner { position: absolute; left: 0; right: 0; top: 20%; text-align: center; font: 700 2.8rem var(--caps);
        letter-spacing: 0.08em; color: var(--gold-hi); text-shadow: 0 2px 10px #000, 0 0 24px rgba(201, 163, 92, 0.45); }
      .hud-death { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(rgba(40, 0, 0, 0.25), rgba(30, 0, 0, 0.7)); font: 700 2rem var(--caps);
        letter-spacing: 0.06em; color: #e7c9b0; text-shadow: 0 2px 8px #000; }

      /* Brújula arriba al centro, con el reloj del piso debajo. */
      .compass { position: absolute; top: 0.9rem; left: 50%; transform: translateX(-50%); width: min(34rem, 56vw);
        pointer-events: none; text-align: center; }
      .compass-strip { position: relative; height: 1.9rem; border-bottom: 1px solid var(--gold-dim);
        mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
      .compass-mark { position: absolute; bottom: 0; width: 1px; height: 0.35rem; background: var(--gold); transform: translateX(-50%); }
      .compass-cardinal { width: auto; height: auto; background: none; bottom: 0.35rem; font: 700 0.95rem var(--caps);
        color: #e9dcc0; text-shadow: 0 1px 3px #000; }
      .compass-pin { position: absolute; left: 50%; bottom: -0.38rem; width: 0.6rem; height: 0.6rem; transform: translateX(-50%) rotate(45deg);
        background: #120f0b; border: 1px solid var(--gold-hi); box-shadow: 0 0 6px rgba(236, 208, 143, 0.6); }
      .compass-clock { margin-top: 0.7rem; display: inline-block; padding: 0.1rem 0.9rem; font: 600 1.35rem var(--serif);
        color: #f3e6c8; font-variant-numeric: tabular-nums; letter-spacing: 0.06em; text-shadow: 0 1px 3px #000, 0 0 10px #000;
        background: radial-gradient(rgba(9, 8, 7, 0.75), transparent 70%); }

      /* Minimapa circular arriba a la derecha. */
      .minimap { position: absolute; top: 1.1rem; right: 1.4rem; width: 10.5rem; height: 10.5rem; pointer-events: none; }
      .minimap canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%;
        background: radial-gradient(rgba(24, 20, 15, 0.82), rgba(9, 8, 7, 0.9)); }
      .minimap-ring { position: absolute; inset: -0.25rem; border-radius: 50%; border: 1px solid var(--gold);
        box-shadow: 0 0 0 3px rgba(9, 8, 7, 0.8), 0 0 0 4px var(--gold-dim), 0 0.3rem 1rem rgba(0, 0, 0, 0.6); }
      .minimap-card { position: absolute; width: 1.35rem; height: 1.35rem; margin: -0.675rem; display: grid; place-items: center;
        font: 700 0.72rem/1 var(--caps); color: var(--gold-hi); }
      .minimap-card::before { content: ""; position: absolute; inset: 0.15rem; z-index: -1; transform: rotate(45deg);
        background: #120f0b; border: 1px solid var(--gold); }
      .minimap-card { isolation: isolate; }
      .minimap-n { left: 50%; top: 0; } .minimap-s { left: 50%; top: 100%; }
      .minimap-e { left: 100%; top: 50%; } .minimap-w { left: 0; top: 50%; }

      /* Aviso de recoger, anclado al objeto con una línea guía. */
      .pickup-hint { position: absolute; left: 0; top: 0; pointer-events: none; display: flex; align-items: center; gap: 0.5rem;
        margin: -3.2rem 0 0 2.2rem; padding: 0.25rem 0.9rem 0.25rem 0.3rem; white-space: nowrap;
        background: linear-gradient(90deg, rgba(9, 8, 7, 0.88), rgba(9, 8, 7, 0.5)); border-bottom: 1px solid var(--gold-dim);
        font: 600 1.05rem var(--serif); color: #f3e6c8; text-shadow: 0 1px 2px #000; will-change: transform; }
      .pickup-hint::before { content: ""; position: absolute; left: -2.2rem; top: 100%; width: 2.6rem; height: 1px;
        background: var(--gold); transform-origin: right center; transform: translate(-0.4rem, 0) rotate(-50deg); }
      .pickup-key { display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border: 1px solid var(--gold-hi);
        background: #120f0b; font: 700 0.95rem var(--caps); color: #f6ead2; }
      .pickup-name { font-weight: 700; }
      .fx-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .fx-number { position: absolute; left: 0; top: 0; font: 700 1.6rem "Cormorant Garamond", Georgia, serif;
        text-shadow: 0 1px 3px #000, 0 0 2px #000; will-change: transform, opacity; }
      .fx-enemy { color: #fff; }
      .fx-player { color: #ff4a3d; }
      .fx-hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0;
        box-shadow: inset 0 0 6rem 1.5rem rgba(220, 20, 10, 0.75); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <form id="lobby" class="panel" autocomplete="off">
      <h1>Roguelike co-op</h1>
      <label>Tu nombre <input id="name" maxlength="16" /></label>
      <button id="create" type="button">Crear sala</button>
      <div class="divider">o</div>
      <div class="row">
        <label>Código de sala <input id="code" maxlength="5" /></label>
        <button id="join" type="submit">Unirse</button>
      </div>
      <p id="lobby-error" class="error" role="alert"></p>
    </form>

    <div id="hud" hidden>
      Sala <span id="hud-code"></span>
      <div class="hint">Clic para mirar · WASD moverse · Shift correr · Espacio saltar · Clic izq. atacar · E tomar arma</div>
    </div>

    <div id="lost" class="panel" hidden>
      <p>Se perdió la conexión</p>
      <button id="rejoin" type="button">Volver a entrar</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
